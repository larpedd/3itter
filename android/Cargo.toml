[package]
name = "itter"
version = "2.0.0"
edition = "2021"
description = "3itter for Android: a native Material 3 Expressive client written in Rust with Slint"
license = "GPL-3.0-only"
publish = false

[lib]
name = "itter"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "itter-desktop"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "3", features = ["json"] }
libc = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
